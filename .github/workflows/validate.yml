name: Validate
on:
  pull_request:
  push:
    branches: [main, develop]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: node scripts/validate.mjs
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Validate Supabase configuration
        run: test -s supabase/config.toml && test -d supabase/migrations && test -d supabase/functions
      - uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x
      - name: Type check Edge Functions
        shell: bash
        run: |
          set -euo pipefail
          for file in supabase/functions/*/index.ts; do
            case "$file" in supabase/functions/lib/*|supabase/functions/tests/*) continue;; esac
            deno check "$file"
          done
